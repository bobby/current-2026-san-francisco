AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloud runtime for the "From Alerts to Autonomy" demo (docs/design.md §4.5):
  one Graviton instance running the Compose stack, with S3 and the Glue Data
  Catalog in place of RustFS and the Iceberg REST catalog. The instance has no
  inbound ports; it's reached through SSM.

Parameters:
  InstanceType:
    Type: String
    Default: m7g.2xlarge
    Description: An arm64 (Graviton) instance type.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  VolumeSize:
    Type: Number
    Default: 100
    Description: Root volume size in GiB (gp3).
  ComposeVersion:
    Type: String
    Default: v5.5.0
    Description: Docker Compose plugin release, installed from GitHub.

Resources:
  # Network: one public subnet. The instance needs outbound access only
  # (image pulls, S3, Glue, SSM); the security group allows no inbound traffic.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public" }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress only; access is through SSM Session Manager.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: All outbound }
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  # Storage: one bucket for the Iceberg warehouse, Flink checkpoints and
  # savepoints, and the Compose bundles that `make deploy-aws` uploads.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-bundles
            Prefix: bundles/
            Status: Enabled
            ExpirationInDays: 7

  # One Glue database per tenant namespace (docs/design.md §4.2). Each has a
  # location in the bucket, so the Iceberg Glue catalog needs no warehouse.
  PaymentsEngDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: payments_eng
        Description: Tenant payments-eng
        LocationUri: !Sub "s3://${Bucket}/warehouse/payments_eng.db"

  TradingDataDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: trading_data
        Description: Tenant trading-data
        LocationUri: !Sub "s3://${Bucket}/warehouse/trading_data.db"

  RiskPlatformDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: risk_platform
        Description: Tenant risk-platform
        LocationUri: !Sub "s3://${Bucket}/warehouse/risk_platform.db"

  MarketDataDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: market_data
        Description: Tenant market-data
        LocationUri: !Sub "s3://${Bucket}/warehouse/market_data.db"

  Customer360Database:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: customer_360
        Description: Tenant customer-360
        LocationUri: !Sub "s3://${Bucket}/warehouse/customer_360.db"

  ComplianceEngDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: compliance_eng
        Description: Tenant compliance-eng
        LocationUri: !Sub "s3://${Bucket}/warehouse/compliance_eng.db"

  # Images built on the laptop (arm64). Deleting the stack deletes the images.
  FlinkRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}/flink"
      EmptyOnDelete: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: platform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Bucket.Arn
              - Sid: Objects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub "${Bucket.Arn}/*"
              - Sid: Glue
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/*"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/*/*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AWS::StackName}/*"
              # Secrets: SecureStrings under /<stack>/, written by
              # `make secrets-aws` (CloudFormation can't create SecureStrings).
              - Sid: Secrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only. A hop limit of 2 lets containers on Docker's bridge
        # network use the instance role.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
      # Docker, the Compose plugin, and the tools the deploy and job scripts
      # use. `make deploy-aws` waits for this to finish.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker jq
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/${ComposeVersion}/docker-compose-linux-aarch64"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          cat > /etc/docker/daemon.json <<'EOF'
          {"log-driver": "local", "log-opts": {"max-size": "50m", "max-file": "3"}}
          EOF
          systemctl enable --now docker
          usermod -aG docker ssm-user 2>/dev/null || true
          usermod -aG docker ec2-user
          mkdir -p /opt/platform

Outputs:
  InstanceId:
    Value: !Ref Instance
  BucketName:
    Value: !Ref Bucket
  Registry:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
  FlinkRepositoryUri:
    Value: !GetAtt FlinkRepository.RepositoryUri
  ParameterPrefix:
    Description: SSM Parameter Store prefix for the demo's secrets.
    Value: !Sub "/${AWS::StackName}/"
