global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Flink's JobManager and TaskManagers via the Prometheus reporter, and the
  # simulated fleet via the fleet-exporter, which reports the same metrics
  # (docs/design.md §5.2). DNS discovery picks up every TaskManager replica.
  - job_name: flink
    dns_sd_configs:
      - names: [jobmanager, taskmanager, fleet-exporter]
        type: A
        port: 9249
        refresh_interval: 15s
